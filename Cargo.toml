[package]
name = "sigmaos_webcam"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["SigmaOS Contributors"]
description = "SigmaOS component: SigmaOS-webcam"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-webcam"
license = "Apache-2.0"
keywords = ["sigmaos", "os", "systems"]
categories = ["os"]
publish = false

[lib]
name = "sigmaos_webcam_lib"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
thiserror = "1.0"
log = "0.4"

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
